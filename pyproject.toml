[project]
name = "anima-trainer"
version = "0.1.0"
description = "Diffusers-native trainer for Anima (Cosmos-Predict2 trunk + LLMAdapter)"
# 3.11 is what every measurement in the README was taken on, and what the installer picks when
# both are present. 3.12 is supported because torch 2.10.0+cu128 ships cp312 wheels for linux
# x86_64 and win_amd64 and the whole graph resolves (verified with `uv lock --python 3.12`), but
# nothing has been *run* on it.
# 3.13 resolves and installs (verified below); SDNQ's author reports it working. Still not the
# default the installers pick, because nothing has been *trained* on it here.
requires-python = ">=3.11,<3.14"

dependencies = [
    # Pinned known-good: sdnq 0.2.4 imports cleanly on stable 2.10 (its >=2.12
    # branch never fires) and this is the torch its Triton path is tested against.
    "torch==2.10.0",
    "torchvision",
    # Triton publishes NO Windows wheels -- 3.6.0 ships manylinux x86_64/aarch64 only, so a plain
    # `triton` dependency makes the whole install unresolvable on Windows. `triton-windows` is the
    # fork that builds them, versioned to track upstream: 3.6.0.postN *is* triton 3.6.0.
    # SDNQ's speed comes from its Triton kernels, so this is load-bearing on Windows, not optional.
    "triton ; sys_platform != 'win32'",
    # Constrained to the 3.6 series on purpose: torch 2.10.0 pins triton==3.6.0 on Linux, and
    # triton-windows tracks upstream version-for-version, so the fork must match. Left unpinned it
    # resolves to 3.7.1, pairing a torch built against Triton 3.6 with a 3.7 runtime.
    "triton-windows>=3.6,<3.7 ; sys_platform == 'win32'",
    # SDNQ's quantizer backend only exists on diffusers main, not in 0.39.0.
    "diffusers",
    "sdnq",
    "transformers>=4.51",  # >=4.51 for Qwen3
    "accelerate",
    "peft",
    "safetensors",
    "sentencepiece",       # T5TokenizerFast slow-tokenizer fallback
    "numpy",
    "pillow",
    "tqdm",
    "toml",
    "einops",
    "openvino>=2026.3.0",
    # torch.compile's inductor backend shells out to a C++ compiler and imports setuptools to do
    # it. Without this, `train.compile` dies at the first step with a bare
    # "ModuleNotFoundError: No module named 'setuptools'" from inside InductorError.
    "setuptools",
]

[project.optional-dependencies]
# Cosine optimal-transport noise pairing (models/anima.py:39). CPU fallback is scipy.
ot = ["scipy"]
gui = [
    "pyside6>=6.11.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
diffusers = { git = "https://github.com/huggingface/diffusers" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anima*"]
